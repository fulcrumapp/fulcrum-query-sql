name: Publish npm package to GitHub Packages

on:
  create:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-npm-publish-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    name: Publish to GitHub Packages
    if: (github.event_name == 'create' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: https://npm.pkg.github.com
          scope: '@fulcrumapp'
      - uses: ./.github/actions/npm-publish-github
        with:
          token: ${{ github.token }}

  release:
    name: Create GitHub release notes
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/npm-create-release
        env:
          GH_TOKEN: ${{ github.token }}
